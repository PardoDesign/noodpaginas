# Elk domein krijgt zijn eigen map. Elk adres (ook oude links) toont de noodpagina met status 503 en
# Retry-After, zodat Google de site als tijdelijk onbereikbaar ziet en de oude pagina's bewaart.
# Alleen /assets/ geeft gewoon 200. Voorbeeld-adressen op pardodesign.app krijgen noindex.
map $host $site {
    default "";
    ~^(www\.)?materprojecten\.nl$        materprojecten.nl;
    ~^(www\.|reserveren\.)?hondenhotelkristien\.nl$ hondenhotelkristien.nl;
    ~^(www\.)?yescarwash\.nl$            yescarwash.nl;
    ~^(www\.)?jpets\.nl$                 jpets.nl;
    ~^(www\.)?houthdiensten\.nl$         houthdiensten.nl;
    ~^(www\.)?boeking\.app$              boeking.app;
    ~^(www\.)?dlylatrishias\.nl$         dlylatrishias.nl;
    ~^(www\.)?headspaenschede\.nl$       headspaenschede.nl;
    ~^(www\.)?hrbexpress\.nl$            hrbexpress.nl;
    ~^(www\.)?loslocos\.nl$              loslocos.nl;
    ~^(www\.)?petipedia\.nl$             petipedia.nl;
    ~^(www\.)?taxidegroenebetuwe\.nl$    taxidegroenebetuwe.nl;
    werkenbij.taxienmeer.nl              werkenbij.taxienmeer.nl;
    planning.taxienmeer.nl               planning.taxienmeer.nl;
    ~^(www\.)?yesfit\.nu$                yesfit.nu;
    ~^(www\.)?ziekenvervoer\.nl$         ziekenvervoer.nl;
    ~^(www\.)?zillio\.nl$                zillio.nl;
    nood-materprojecten.pardodesign.app  materprojecten.nl;
    nood-hondenhotel.pardodesign.app     hondenhotelkristien.nl;
    nood-yescarwash.pardodesign.app      yescarwash.nl;
    nood-jpets.pardodesign.app           jpets.nl;
    nood-houthdiensten.pardodesign.app   houthdiensten.nl;
    nood-boeking.pardodesign.app         boeking.app;
    nood-dlylatrishias.pardodesign.app   dlylatrishias.nl;
    nood-headspa.pardodesign.app         headspaenschede.nl;
    nood-hrbexpress.pardodesign.app      hrbexpress.nl;
    nood-loslocos.pardodesign.app        loslocos.nl;
    nood-petipedia.pardodesign.app       petipedia.nl;
    nood-taxidegroenebetuwe.pardodesign.app taxidegroenebetuwe.nl;
    nood-werkenbij.pardodesign.app       werkenbij.taxienmeer.nl;
    nood-planning.pardodesign.app        planning.taxienmeer.nl;
    nood-yesfit.pardodesign.app          yesfit.nu;
    nood-ziekenvervoer.pardodesign.app   ziekenvervoer.nl;
    nood-zillio.pardodesign.app          zillio.nl;
}
map $host $robots {
    default                  "all";
    ~\.pardodesign\.app$     "noindex, nofollow";
    planning.taxienmeer.nl   "noindex, nofollow";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html/sites/$site;

    if ($site = "") { return 444; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Robots-Tag $robots always;

    location /assets/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag $robots always;
    }

    location = /favicon.ico {
        try_files /assets/favicon.png =404;
    }

    location / {
        return 503;
    }

    error_page 503 /index.html;
    location = /index.html {
        internal;
        add_header Retry-After "3600" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Robots-Tag $robots always;
    }
}
